- name: install mysql server
  ansible.builtin.dnf:
    name: mysql8.4-server
    state: present

- name: install python mysql and boto libraries
  ansible.builtin.pip:
    name:
      - PyMySQL
      - boto3
      - botocore
    executable: pip3

- name: start and enable mysql server
  ansible.builtin.service:
    name: mysqld
    state: started
    enabled: true