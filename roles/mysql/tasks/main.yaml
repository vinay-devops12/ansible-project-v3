- name: install mysql server
  ansible.builtin.dnf:
    name: community-mysql-server
    state: present

- name: install python mysql and boto libraries
  ansible.builtin.pip:
    name:
      - PyMySQL
      - boto3
      - botocore
    executable: pip3

- name: start and enable mysql server
  ansible.builtin.service:
    name: mysqld
    state: started
    enabled: true

- name: check mysql connection with current root password
  ansible.builtin.command: mysql -u root -p"{{ mysql_root_password }}" -e "exit"
  register: mysql_connection
  ignore_errors: true
  changed_when: false

- name: setup root password
  ansible.builtin.command: mysql_secure_installation --set-root-pass "{{ mysql_root_password }}"
  when: mysql_connection.failed