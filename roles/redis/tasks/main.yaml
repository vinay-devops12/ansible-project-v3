- name: install valkey
  ansible.builtin.dnf:
    name: valkey
    state: present

- name: allow remote connections
  ansible.builtin.lineinfile:
    path: /etc/valkey/valkey.conf
    regexp: '^bind '
    line: 'bind 0.0.0.0'
  notify: restart valkey

- name: change protected mode
  ansible.builtin.lineinfile:
    path: /etc/valkey/valkey.conf
    regexp: '^protected-mode'
    line: 'protected-mode no'
  notify: restart valkey

- name: start and enable valkey
  ansible.builtin.service:
    name: valkey
    state: started
    enabled: true
